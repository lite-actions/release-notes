name: Publish

# Manual publish for the action: generate notes from BREAKING/feat/fix commits
# since the last release, tag vX.Y.Z, move the vN major tag, and publish a
# GitHub Release. Tags are not branch-protected, so no PR/approval dance needed.
on:
  workflow_dispatch:
    inputs:
      from:
        description: "Base ref/commit for the notes (default: last release tag)."
        required: false
        default: ""
      to:
        description: "Head ref/commit for the notes (default: HEAD)."
        required: false
        default: ""
      version:
        description: "Explicit version, e.g. 1.2.0 (default: computed from commits)."
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: lite-actions/git-checkout@90733d329cd6c632c7597660341002e1a1377c44 # v1.1.0
        with:
          fetch-depth: 0
          fetch-tags: true

      # This repo IS release-notes, so it generates its notes from the working
      # tree. A regression in generate.sh surfaces here before it ships;
      # consumers get @v1.
      #
      # That is also why this step cannot come from actions-workflows, which
      # hardcodes lite-actions/release-notes@v1. Expressions are not allowed in
      # `uses:`, so no input can point it at `./` instead. The conflict is with
      # the release-notes dependency - the tagging and GitHub Release around it
      # are generic, and duplicating them here is a known cost, tracked
      # separately.
      - name: Generate release notes
        id: notes
        uses: ./
        with:
          from: ${{ github.event.inputs.from }}
          to: ${{ github.event.inputs.to }}
          version: ${{ github.event.inputs.version }}

      - name: Tag, move major tag, and publish release
        if: steps.notes.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.notes.outputs.version }}
          NOTES_FILE: ${{ steps.notes.outputs.file }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          tag="v${VERSION}"
          major="v${VERSION%%.*}"
          git tag -a "${tag}" -m "Release ${VERSION}"
          # Force-move the major tag so consumers on @vN get this release.
          git tag -f -a "${major}" -m "${major} -> ${VERSION}"
          git push origin "${tag}"
          git push origin -f "${major}"
          # The generated notes file is the GitHub Release body.
          gh release create "${tag}" --title "${VERSION}" --notes-file "${NOTES_FILE}"
