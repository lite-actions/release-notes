name: Publish

# Manual publish for the action: generate notes from BREAKING/feat/fix commits
# since the last release, tag vX.Y.Z, move the vN major tag, and publish a
# GitHub Release. Tags are not branch-protected, so no PR/approval dance needed.
on:
  workflow_dispatch:
    inputs:
      from:
        description: "Base ref/commit for the notes (default: last release tag)."
        required: false
        default: ""
      to:
        description: "Head ref/commit for the notes (default: HEAD)."
        required: false
        default: ""
      version:
        description: "Explicit version, e.g. 1.2.0 (default: computed from commits)."
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: lite-actions/git-checkout@v1
        with:
          fetch-depth: 0
          fetch-tags: true

      # Dogfooding: this repo runs its own action from the working tree, so a
      # regression on main shows up here first. Consumers use @v1.
      #
      # Deliberately NOT migrated to common-workflows/publish. That action
      # calls lite-actions/release-notes@v1, so this repo would generate its
      # own notes with the *previously published* version of itself rather
      # than the version being released - a regression in generate.sh would
      # be invisible here and ship anyway.
      #
      # Only this step is affected: the tagging and GitHub Release that the
      # shared action performs are generic. It is the notes generation that
      # has to stay local, for the same reason as changelog.yml.
      - name: Generate release notes
        id: notes
        uses: ./
        with:
          from: ${{ github.event.inputs.from }}
          to: ${{ github.event.inputs.to }}
          version: ${{ github.event.inputs.version }}

      - name: Tag, move major tag, and publish release
        if: steps.notes.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.notes.outputs.version }}
          NOTES_FILE: ${{ steps.notes.outputs.file }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          tag="v${VERSION}"
          major="v${VERSION%%.*}"
          git tag -a "${tag}" -m "Release ${VERSION}"
          # Force-move the major tag so consumers on @vN get this release.
          git tag -f -a "${major}" -m "${major} -> ${VERSION}"
          git push origin "${tag}"
          git push origin -f "${major}"
          # The generated notes file is the GitHub Release body.
          gh release create "${tag}" --title "${VERSION}" --notes-file "${NOTES_FILE}"
